 wfdecide:d=>{const s=sub(S.wfopen),a=document.querySelector('input[name=wfauth]:checked'),why=val('wf_dwhy'),t=Date.now();if(!a){S.err='Choose the authority path for this decision.';return render()}if(d.v==='Reject'&&!why){S.err='Give a reason. A rejection must say why.';return render()}snapshot([s.id],'decision');s.dec={d:d.v,auth:a.value,why,by:me().name,t};
   if(d.v==='Accept'){const i=s.wf.inst;s.auto=s.channel==='API';s.docket=i.dk==='new'?newDocket():i.dk==='existing'?i.no:(s.docket||newDocket());s.status='DOCKETED';s.events.push({t,l:'Accepted under '+a.value.toLowerCase()+'; docketed '+(s.auto?'automatically ':'')+'as '+s.docket,by:me().name});note(s.filer,'Your filing '+s.num+' was accepted and docketed as '+s.docket+'.',s.id);if(i.el!=='hold')sendEl(s,t+1,'System')}
   else{s.status='REJECTED';s.reason=why;s.events.push({t,l:'Rejected under '+a.value.toLowerCase()+': '+why,by:me().name});note(s.filer,'Your filing '+s.num+' was rejected. Reason: '+why,s.id)}
   S.wfopen=null;S.err='';render();toast(s.num+(d.v==='Accept'?' accepted and docketed as '+s.docket+(s.status==='COMPLETED'?'. Content published to eLibrary.':'. Held from eLibrary as instructed.'):' rejected.'),1)},
 apisim:()=>{const v=val('wf_api').split('|'),bad=document.getElementById('wf_apibad').checked,x=apiIn(v[0],v[1],Date.now(),bad);note(x.filer,bad?'Your API submission '+x.num+' was rejected: '+x.reason+'.':x.an?'Your API submission '+x.num+' passed the data checks and was accepted automatically.':'Your API submission '+x.num+' was received and sent to '+OFF[x.wf.office]+'.',x.id);render();toast(bad?x.num+' failed the data checks and was rejected automatically.':x.an?x.num+' accepted automatically. Notification sent to '+(x.an.osec?'':'OSEC and ')+x.an.office+'.':x.num+' arrived by API and is in '+x.wf.office+' intake.')},

 regstep:d=>{if(+d.i<S.reg.step){S.reg.step=+d.i;S.err='';render()}},

   else if(r.step===1){Object.assign(d,{title:val('r_title'),street:val('r_street'),street2:val('r_street2'),city:val('r_city'),state:val('r_state'),zip:val('r_zip'),country:val('r_country'),phone:val('r_phone')});
     e=!d.street||!d.city||!d.state||!d.country?'Fill in street, city, state and country.':!/^\d{5}(-\d{4})?$/.test(d.zip)?'Enter a 5-digit ZIP code.':d.phone.replace(/\D/g,'').length<10?'Enter a phone number with at least 10 digits.':''}
   else{if(!d.cit)Object.assign(d,{org:val('r_org'),aname:val('r_aname'),aphone:val('r_aphone'),aemail:val('r_aemail')});e=!d.cit&&!d.org?'Choose your employer, or tick the private citizen box.':''}

 addc:d=>{const dr=S.draft,p=partyList(dr)[+d.k],e=val('c_'+d.k).toLowerCase();if(!S.users.some(u=>u.email===e)){S.err='No registered user has the email '+(e||'you entered')+'. Contacts must be registered.';return render()}dr.contacts[p]=dr.contacts[p]||[];if(dr.contacts[p].some(c=>c.email===e)){S.err='That contact is already listed for '+p+'.';return render()}dr.contacts[p].push({email:e,role:d.role});S.err='';render()},

 submit:()=>{const dr=S.draft;for(let k=0;k<6;k++){const e=stepOK(k);if(e){S.err=e;dr.step=k;return render()}}
   if(dr.org&&roleIn(dr.org)===ROLES[2]){S.err='As a Preparer for '+dr.org+' you cannot certify or submit.';return render()}
   if(!dr.val||dr.val.sig!==sig(dr)){S.err='Run validation before you submit.';return render()}
   if(dr.val.err){S.err='Correct the validation errors before you submit.';return render()}
   if(!dr.cert){S.err='Tick the box to confirm you have reviewed this filing.';return render()}
   const u=me(),t=Date.now();let s,msg;
   if(dr.edit){s=sub(dr.edit);const po=s.status==='PROGRAM_OFFICE';Object.assign(s,{files:dr.files,parties:dr.parties,contacts:dr.contacts,desc:dr.desc,docket:dr.docket,mode:dr.mode});
     if(po){s.wf.dr=null;s.wf.blocked='';s.amended=true;s.events.push({t,l:'Supplemental filing received in response to the data request',by:u.name});msg='We received your response on '+s.num+'. It is back with '+OFF[s.wf.office]+'.'}
     else{s.status='RECEIVED';delete s.request;s.events.push({t,l:'Corrected and resubmitted',by:u.name})}}
   else{const id=Math.max(...S.subs.map(x=>x.id))+1,acc=accNo(t,id);s={id,num:'S-'+id,acc,org:dr.org,rel:dr.rel,filer:u.email,cat:dr.cat,kind:dr.kind,type:dr.type,fee:dr.fee,paid:dr.paid,docket:dr.docket,desc:dr.desc,files:dr.files,mode:dr.mode,parties:dr.parties,contacts:dr.contacts,status:'RECEIVED',owner:null,created:t,events:[{t,l:'Submitted'+(dr.src?' (started from '+sub(dr.src).num+')':''),by:u.name},{t:t+1,l:'Received by the agency, accession '+acc+', confirmation sent',by:'System'}]};S.subs.push(s);
     if(dr.rel){const o=sub(dr.rel.id);if(dr.rel.kind==='Supplement')o.amended=true;o.events.push({t,l:dr.rel.kind+' filed as '+s.num,by:u.name})}}
   note(u.email,msg||'We received your filing '+s.num+', accession '+s.acc+'. It is now with the Office of the Secretary.',s.id);if(dr.calk)ost(dr.calk).linked=s.id;S.draft=null;go('filing-'+s.id);toast('Filing '+s.num+' submitted.')},

   if(D.kind!=='accept'){reasons=[...document.querySelectorAll('input[name=rs]:checked')].map(e=>REASONS[+e.value]);if(!reasons.length){S.err=D.kind==='reject'?'Choose a reason. A rejection must give one.':'Choose at least one reason.';return render()}}
   const msg=val('dl_msg'),due=val('dl_due');snapshot(D.ids,D.kind);
   D.ids.forEach(id=>{const s=sub(id);s.owner=s.owner||u.email;
     if(D.kind==='accept'){s.status='CLEARED';s.events.push({t,l:'OSEC review complete, cleared for program office review',by:u.name});note(s.filer,'Your filing '+s.num+' passed the Office of the Secretary check. A program office reviews it next.',s.id)}
     else if(D.kind==='reject'){s.status='REJECTED';s.reason=reasons[0];s.dec={d:'Reject',auth:'Delegated authority',why:reasons[0],by:u.name,t};s.events.push({t,l:'Rejected: '+reasons[0],by:u.name});note(s.filer,'Your filing '+s.num+' was rejected. Reason: '+reasons[0]+'.',s.id)}
     else{s.status='INFO_REQUESTED';s.request={reasons,msg,due:due?new Date(due).getTime():t+7*DAY};s.events.push({t,l:'Information requested: '+reasons.join('; '),by:u.name});note(s.filer,'Information requested on '+s.num+'. Respond by '+fd(s.request.due)+'.',s.id)}});
   const n=D.ids.length,w={accept:'cleared for program office review',reject:'rejected',request:'sent an information request'}[D.kind];S.dlg=null;S.sel.clear();S.err='';render();toast(n+' submission'+(n===1?'':'s')+' '+w+'.',1)},

 calms:d=>{const i=calItems().find(x=>x.k===d.k),s=ost(d.k),add=[[-10,'Draft ready'],[-5,'Legal review'],[-3,'Approval'],[-1,'Planned submission']].map(([o,l])=>({t:i.t+o*DAY,label:l})).filter(m=>m.t>Date.now()&&!s.ms.some(x=>x.label===m.label));s.ms.push(...add);s.ms.sort((a,b)=>a.t-b.t);render();toast(add.length?add.length+' preparation date'+(add.length===1?'':'s')+' added.':'No future dates left to add.')},
 calmsdel:d=>{ost(d.k).ms.splice(+d.j,1);render()},
 calstart:d=>{const i=calItems().find(x=>x.k===d.k);if(S.draft){go('file');return toast('Finish or discard your current draft first.')}newDraft(null,null,i.org||S.org||'');const dr=S.draft;dr.cat=i.cat;dr.kind=i.kind;const ty=typesOf(dr.cat,dr.kind)[0];dr.type=ty.n;dr.fee=ty.fee;dr.docket=i.docket||'';dr.calk=i.k;dr.step=2;go('file');toast('Filing started for '+i.title+'.')},
 calsend:d=>{const i=calItems().find(x=>x.k===d.k),x=apiIn(i.code,i.cat,Date.now(),false,i.org);x.filer=S.session;ost(d.k).linked=x.id;note(S.session,'Your system sent '+i.code+' as '+x.num+'.',x.id);render();toast(i.code+' received from your system as '+x.num+' (sample).')},
 caldock:d=>{const u=me();u.dockets=u.dockets||[];const at=u.dockets.indexOf(d.n);if(at>=0)u.dockets.splice(at,1);else u.dockets.push(d.n);render();toast(at>=0?'Unsubscribed from '+d.n+'.':'Subscribed to '+d.n+'. Its deadlines now appear on your calendar.')},
 calexp:async()=>{if(!CALDL)return;try{await CALDL.save({filename:'filing-calendar.csv',data:calCsv()});toast('Calendar file saved.')}catch(e){if(e&&e.code==='declined')return;toast('The file could not be saved here. Use Copy iCalendar text instead.')}},
 calics:async()=>{const t=calIcs();let pr=null;try{pr=navigator.clipboard.writeText(t)}catch(e){}S.cal.ics=t;render();const box=document.getElementById('cal_ics');if(box){box.focus();box.select()}try{if(!pr)throw 0;await pr;toast('iCalendar text copied. Save it as a .ics file to import it.')}catch(e){toast('Select the text in the box and copy it.')}},
 calicsclose:()=>{S.cal.ics='';render()}});
seed();const h=location.hash.slice(1);if(['home','register','login'].includes(h))S.route=h;render();
</script>
